# `dbuild`: cross-platform (Windows & Linux) host build, test, image, and contributor CLI for D-OS.
# Zero external crates: uses only std and the in-tree `dosfs` and `doscrypt` libraries.
[package]
name = "dbuild"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
dosfs = { path = "../../user/lib/fs" }
doscrypt = { path = "../../user/lib/crypto" }

[profile.release]
opt-level = 2
debug = false
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
