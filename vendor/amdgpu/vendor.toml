    "src/dc_regs.c",
    "src/dc_dmub.c",
    "src/dc_dml2.c",
    "src/dc_dsc.c",
    "src/dc_link.c",
    "src/dc_core.c",
    "src/amdgpu_device.c",
    "src/amdgpu_capi.c",
]
