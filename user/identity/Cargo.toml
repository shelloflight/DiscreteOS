# D-OS user identity & TPM 2.0 credential sealing service (`identity.dsvc`).
[package]
name = "identity"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata.dos]
dsvc = ["identity"]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }
dosid = { path = "../lib/identity" }
doscrypt = { path = "../lib/crypto" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
