# init: the first user process and the service manager. Started by the kernel with the log, the
# embedded programs and service manifests, the devices and the VMEX, POWER and MEASURE resources.
# Reads the manifests (embedded in the verified kernel, or signed on the boot volume), starts the
# services in dependency order with exactly the capabilities each manifest grants, supervises and
# restarts them, connects them through named endpoints, and shuts them down in reverse order.
# Also the test runner of the ring-3 test images (see src/lib.rs). Linked by dbuild like the
# other ring-3 programs (static PIE).
[package]
name = "init"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }
dman = { path = "../lib/dman" }
doscrypt = { path = "../lib/crypto" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"