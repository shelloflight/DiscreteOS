# D-OS network service (`net.dsvc`): in-tree TCP/IP, ARP, ICMP, UDP, DHCP, DNS service.
[package]
name = "net"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata.dos]
dsvc = ["net"]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }
dosnet = { path = "../lib/net" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
