# The storage service: block layer over the user-space disk drivers, GPT, FAT32 and
# DFS volumes, and the file service (every open file is a channel). Started by init; disks come
# from devmgr. `test` turns on the test hooks (corruption, power cut, remount, fsck).
# Linked by dbuild (ld.lld, static PIE) like the other ring-3 programs.
[package]
name = "storaged"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }
dosfs = { path = "../lib/fs" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
