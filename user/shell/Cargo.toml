# The shell (docs/shell.md): one session on the terminal. Commands exchange typed records, filtered
# with plain words and shown as a table at the end; tools get only the paths typed.
[package]
name = "shell"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }
dman = { path = "../lib/dman" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
