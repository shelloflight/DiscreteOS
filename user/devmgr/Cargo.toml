# Device framework, user side: the device manager service and the drivers, one crate.
#   devmgr.dx          the device manager: binds drivers to devices, restarts them when they die,
#                      collects keyboard input; `test` runs the driver test suite
#   ps2.ddrv           PS/2 keyboard (moved out of the kernel)
#   virtio-blk.ddrv    virtio block device (modern virtio-pci, MSI-X, DMA through the IOMMU)
#   virtio-input.ddrv  virtio keyboard
#   ahci.ddrv          AHCI (SATA) disks
#   nvme.ddrv          NVMe namespace 1
#   xhci.ddrv          xHCI USB host controller: USB keyboards (HID boot protocol)
# One staticlib; build.ps1 links it once per program with that program's entry symbol (`_start`,
# `ddrv_<name>`), and --gc-sections keeps only what each one uses. Each driver runs as its own
# isolated process. Linked like the other ring-3 programs (static PIE).
[package]
name = "devmgr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata.dos]
ddrv = ["ps2", "virtio-blk", "virtio-input", "ahci", "nvme", "xhci"]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = false
overflow-checks = true  # Secure: device data is untrusted; a missed check ends the driver, never wraps
debug-assertions = false
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
