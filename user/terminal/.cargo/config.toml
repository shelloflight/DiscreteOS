[build]
target = "x86_64-unknown-none"   # freestanding; linked by build.ps1 into a ring-3 static PIE

[target.x86_64-unknown-none]
# The target's own code is position independent (relocation model pic), so it links into a
# static PIE; its code model must match the prebuilt core library (LTO), so it is not overridden.
rustflags = [
    "-C", "force-frame-pointers=yes",
]
