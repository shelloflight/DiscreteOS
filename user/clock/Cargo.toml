# The clock service: wall-clock time (UTC) from the UEFI boot-time record or the CMOS RTC, served on
# the clock.time endpoint as a base the client adds monotonic time to (docs/services.md).
[package]
name = "clock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[dependencies]
libd = { path = "../lib/libd", features = ["alloc"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
