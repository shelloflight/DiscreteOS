# `dosnet`: pure no_std, zero-unsafe, in-tree networking & TLS 1.3 core for D-OS.
# Shared between `net.dsvc`, client TLS helpers, host unit/fuzz tests (`net-host`),
# and `dbuild`'s offline QEMU TLS 1.3 test server.
[package]
name = "dosnet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
doscrypt = { path = "../crypto" }

[features]
tls-server = []

[profile.test]
opt-level = 2
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
