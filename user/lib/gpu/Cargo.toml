# `dosgpu`: pure no_std, zero-unsafe, in-tree GPU & display core for D-OS.
# Shared between GPU `.ddrv` drivers (`virtio-gpu`, `amdgpu`, `xe`, `nvgpu`), `gpu.dsvc`,
# and host unit/fuzz tests (`gpu-host`).
[package]
name = "dosgpu"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"
bench = false

[profile.test]
opt-level = 2
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
